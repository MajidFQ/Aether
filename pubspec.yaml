name: aether
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  
  # Firebase (3.x / 5.x required for Dart 3.10+ web: older firebase_auth_web breaks on Chrome)
  firebase_core: ^3.13.0
  firebase_auth: ^5.5.0
  cloud_firestore: ^5.6.0
  google_sign_in: ^7.0.0
  
  # State Management
  provider: ^6.1.1
  
  # AI & HTTP
  http: ^1.1.0
  
  # UI
  flutter_markdown: ^0.6.18
  intl: ^0.18.1
  google_fonts: ^6.1.0
  crypto: ^3.0.3
  sign_in_with_apple: ^6.1.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
